<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slate: text to video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #E7E9EE;
    --panel: #F6F7F9;
    --ink: #141A26;
    --muted: #5B6475;
    --line: #C9CEDA;
    --cobalt: #2B3FE6;
    --cobalt-dark: #1E2DB0;
    --rec: #E8452C;
    --display: "Bricolage Grotesque", "Arial Black", sans-serif;
    --body: "Instrument Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--body); font-size: 16px; line-height: 1.5;
  }
  .app {
    max-width: 1180px; margin: 0 auto; padding: 28px 24px 48px;
    display: grid; grid-template-columns: 360px 1fr; gap: 32px; align-items: start;
  }
  h1 {
    font-family: var(--display); font-weight: 800; font-size: 44px;
    line-height: 1; letter-spacing: -0.03em; margin: 0 0 10px;
  }
  .lede { color: var(--muted); margin: 0 0 28px; max-width: 34ch; }

  label { display: block; font-weight: 600; margin-bottom: 8px; }
  textarea {
    width: 100%; min-height: 150px; resize: vertical; padding: 14px;
    font: inherit; color: var(--ink); background: var(--panel);
    border: 1.5px solid var(--line); border-radius: 6px;
  }
  textarea:focus-visible, button:focus-visible, a:focus-visible {
    outline: 3px solid var(--cobalt); outline-offset: 2px;
  }
  .count { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; margin: 6px 0 16px; }

  button.go {
    width: 100%; padding: 14px 18px; font: 600 17px var(--body);
    color: #fff; background: var(--cobalt); border: 0; border-radius: 6px; cursor: pointer;
  }
  button.go:hover:not(:disabled) { background: var(--cobalt-dark); }
  button.go:disabled { background: #8F99D8; cursor: not-allowed; }

  .ideas { margin-top: 28px; }
  .ideas p { font-weight: 600; margin: 0 0 8px; }
  .ideas button {
    display: block; width: 100%; text-align: left; padding: 10px 12px; margin-bottom: 6px;
    font: 400 15px var(--body); color: var(--ink); background: transparent;
    border: 1px solid var(--line); border-radius: 6px; cursor: pointer;
  }
  .ideas button:hover { background: var(--panel); border-color: var(--ink); }

  /* The stage is the memorable element: a monitor with a render clock */
  .stage-wrap { position: sticky; top: 24px; }
  .monitor {
    background: var(--ink); border-radius: 10px; padding: 12px;
    box-shadow: 0 1px 0 #fff inset, 0 18px 40px -20px rgba(20,26,38,.55);
  }
  .screen {
    position: relative; aspect-ratio: 16 / 9; background: #0B0F18;
    border-radius: 4px; overflow: hidden; display: grid; place-items: center;
  }
  .screen video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  .state { text-align: center; padding: 24px; color: #C8CEDB; max-width: 40ch; }
  .state strong { display: block; color: #fff; font: 600 20px var(--display); margin-bottom: 6px; }
  .clock {
    font-family: var(--display); font-weight: 800; font-size: clamp(48px, 9vw, 92px);
    color: #fff; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1;
  }
  .rec { display: inline-flex; align-items: center; gap: 8px; color: #fff; font-weight: 600; margin-bottom: 14px; }
  .rec i { width: 11px; height: 11px; border-radius: 50%; background: var(--rec); animation: blink 1.2s steps(2, jump-none) infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  @media (prefers-reduced-motion: reduce) { .rec i { animation: none; } }

  .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 4px 2px; color: #AEB6C6; font-size: 14px; }
  .bar a { color: #fff; font-weight: 600; text-decoration: none; border-bottom: 1.5px solid var(--cobalt); }
  .bar a[hidden] { display: none; }
  .error { color: #FFB4A6; }

  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    .stage-wrap { position: static; order: -1; }
    h1 { font-size: 36px; }
  }
</style>
</head>
<body>
<main class="app">
  <section>
    <h1>Slate</h1>
    <p class="lede">Describe a shot. Get a short video back in a minute or two.</p>

    <label for="prompt">Your scene</label>
    <textarea id="prompt" maxlength="500" placeholder="A slow dolly shot through a rainy Lagos market at dusk, neon signs reflecting in puddles"></textarea>
    <div class="count"><span>Be specific about subject, camera and light.</span><span id="count">0/500</span></div>
    <button class="go" id="go">Generate video</button>

    <div class="ideas">
      <p>Try one of these</p>
      <button type="button">A drone shot rising over green hills at sunrise, mist in the valleys</button>
      <button type="button">Close-up of coffee being poured into a white cup, steam curling, soft window light</button>
      <button type="button">A red fox trotting through fresh snow in a pine forest, shallow depth of field</button>
    </div>
  </section>

  <section class="stage-wrap" aria-live="polite">
    <div class="monitor">
      <div class="screen" id="screen">
        <div class="state"><strong>No video yet</strong>Your result plays here.</div>
      </div>
      <div class="bar">
        <span id="meta">Ready</span>
        <a id="download" href="#" download hidden>Download video</a>
      </div>
    </div>
  </section>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const prompt = $("prompt"), go = $("go"), screen = $("screen"), meta = $("meta"), dl = $("download");
  let timer = null;

  prompt.addEventListener("input", () => { $("count").textContent = `${prompt.value.length}/500`; });
  document.querySelectorAll(".ideas button").forEach((b) =>
    b.addEventListener("click", () => { prompt.value = b.textContent; prompt.dispatchEvent(new Event("input")); prompt.focus(); })
  );

  const mmss = (s) => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  function showRendering() {
    screen.innerHTML = `<div class="state"><div class="rec"><i></i>Rendering</div><div class="clock" id="clock">00:00</div></div>`;
    const start = Date.now();
    timer = setInterval(() => { $("clock").textContent = mmss(Math.floor((Date.now() - start) / 1000)); }, 1000);
  }
  function stopTimer() { clearInterval(timer); timer = null; }

  function showError(msg) {
    stopTimer();
    screen.innerHTML = `<div class="state"><strong class="error">Something went wrong</strong>${msg}</div>`;
    meta.textContent = "Failed";
  }

  async function api(url, options) {
    const r = await fetch(url, options);
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || `Request failed (${r.status})`);
    return data;
  }

  go.addEventListener("click", async () => {
    const text = prompt.value.trim();
    if (text.length < 5) { prompt.focus(); return; }

    go.disabled = true; dl.hidden = true; meta.textContent = "Starting";
    showRendering();

    try {
      const { id } = await api("/api/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt: text }),
      });

      meta.textContent = "Rendering, usually 1 to 3 minutes";
      const deadline = Date.now() + 10 * 60 * 1000;

      while (Date.now() < deadline) {
        await sleep(3000);
        const s = await api(`/api/status/${id}`);
        if (s.status === "succeeded" && s.videoUrl) {
          stopTimer();
          screen.innerHTML = `<video src="${s.videoUrl}" controls autoplay loop playsinline></video>`;
          dl.href = s.videoUrl; dl.hidden = false;
          meta.textContent = "Done. Save it now: the link expires after about an hour.";
          return;
        }
        if (s.status === "failed" || s.status === "canceled") throw new Error(s.error || "The model could not make this video. Try rewording the scene.");
      }
      throw new Error("This is taking too long. Try again in a few minutes.");
    } catch (err) {
      showError(err.message);
    } finally {
      go.disabled = false;
    }
  });
</script>
</body>
</html>
